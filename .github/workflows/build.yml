name: Build Nifty Pro Quant Terminal

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             libgtk-3-0             libgstreamer1.0-0             libgstreamer-plugins-base1.0-0             libglib2.0-0             libmpv2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet

      - name: Verify Flet
        run: |
          flet --version

      - name: Build Linux package
        run: |
          mkdir -p build_output
          flet pack main.py --name NiftyPro-Quant-Terminal

      - name: Collect build
        run: |
          find . -maxdepth 3 -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.zip" -o -name "NiftyPro-Quant-Terminal*" \) -print || true
          cp -r dist/* build_output/ 2>/dev/null || true
          cp -r build/* build_output/ 2>/dev/null || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NiftyPro-Quant-Terminal
          path: build_output
          if-no-files-found: warn
